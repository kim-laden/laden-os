# Laden OS package sources.
# Official Arch Linux repositories only. Baseline x86_64, not an optimized fork.
# This file is used to BUILD the image and is also the live system's pacman.conf
# (it is placed in the root before pacstrap, and pacman.conf is a backup file).
# Do not Include the host mirror list. The build host may be a derivative.

[options]
HoldPkg = pacman glibc
Architecture = x86_64
ParallelDownloads = 4
# A mirror that stalls otherwise aborts the whole image build.
DisableDownloadTimeout
# Packages must be signed. Database signatures are optional because, on
# 2026-11-08, geo.mirror.pkgbuild.com, mirror.pkgbuild.com, and
# berlin.mirror.pkgbuild.com returned HTTP 404 for core.db.sig, extra.db.sig,
# and multilib.db.sig while the .db files themselves returned HTTP 200.
# Archiso 92 uses this same SigLevel. DatabaseRequired cannot sync.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
CheckSpace

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.pkgbuild.com/$repo/os/$arch

# multilib is enabled so a later gamer profile can install Steam's 32-bit
# libraries. The lab set does not install packages from this repository.
[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# BlackArch is a signed add-on repository. Official Arch still wins when a
# package name exists in both. The keyring package is installed in the image;
# this build does not run strap.sh and does not install the whole catalogue.
# Denial-of-service, keylogger, and backdoor groups are not selected.
[blackarch]
Server = https://ftp.halifax.rwth-aachen.de/blackarch/$repo/os/$arch
Server = https://mirror.osbeck.com/blackarch/$repo/os/$arch
Server = https://mirrors.ocf.berkeley.edu/blackarch/$repo/os/$arch
