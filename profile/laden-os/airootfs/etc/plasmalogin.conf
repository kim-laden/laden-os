# Local seat autologin for the live image.
# The live account password is locked. Logout returns to the same local session
# because Relogin is true. An installed system must not keep this file.
# Session file: /usr/share/wayland-sessions/plasma.desktop

[Autologin]
User=live
Session=plasma.desktop
Relogin=true

[General]
DisplayServer=wayland
