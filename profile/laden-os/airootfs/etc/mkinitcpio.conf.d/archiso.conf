# The archiso hook mounts the live medium. The bootloader passes
# archisobasedir= and archisosearchuuid=. Without this file, mkinitcpio
# keeps the distribution's systemd initrd, which waits for a GPT root
# and never mounts the squashfs.
# PXE hooks are not included. This image is a local live medium.
#
# The block hook copies essentially every storage driver into the early
# initramfs. That image was about 62 MB and failed to unpack on a small
# VMware BIOS guest ("Initramfs unpacking failed: write error"), so the
# later hooks then ran without libzstd or systemd-udevd. These modules
# cover QEMU virtio, USB sticks, NVMe, SATA/AHCI, IDE, and the SCSI
# controllers VMware Workstation offers (LSI, SAS, PVSCSI, BusLogic).
MODULES=(
    cdrom sr_mod sg isofs
    loop squashfs overlay dm_mod dm_snapshot
    sd_mod ahci libahci ata_piix ata_generic pata_acpi
    virtio virtio_pci virtio_blk virtio_scsi
    vmw_pvscsi mptspi mptsas mpt3sas BusLogic
    nvme
    usb_storage uas xhci_pci xhci_hcd ehci_pci uhci_hcd ohci_pci usbhid hid_generic
)
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
