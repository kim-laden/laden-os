# Live system package sources for Laden OS.
# Official Arch Linux only. Baseline x86_64.

[options]
HoldPkg = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
# Packages must be signed. Official mirrors do not publish .db.sig (HTTP 404
# on 2026-11-08). Archiso 92 uses the same setting.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Installed by blackarch-mirrorlist. Arch repositories stay first.
[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist
