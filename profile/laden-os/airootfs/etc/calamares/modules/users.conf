---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: true
      system: true
    - lp
    - video
    - audio
    - storage
    - input
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    minLength: 1
    maxLength: -1
    libpwquality:
        - minlen=1
        - minclass=0
user:
    shell: /bin/fish
    forbidden_names: [ root, live ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "laden"
allowActiveDirectory: false
