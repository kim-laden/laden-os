# Base partition settings. laden-install replaces the ignored list before
# Calamares starts. Do not add a disk here by hand.
---
defaultFileSystemType: ext4
efiSystemPartition: "/boot"
efiSystemPartitionName: LADENESP
enableLuksAutomatedPartitioning: false
userSwapChoices:
    - small
    - none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: replace
initialSwapChoice: small
defaultPartitionTableType: gpt
ignored: []
