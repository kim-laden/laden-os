LABEL laden
TEXT HELP
Boot Laden OS on BIOS. Give the machine at least 4 GB of RAM.
The live session starts fresh. Changes are discarded on reboot.
ENDTEXT
MENU LABEL Laden OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL laden-lts
TEXT HELP
Boot Laden OS on the LTS kernel. Give the machine at least 4 GB of RAM.
The default entry stays the current kernel.
ENDTEXT
MENU LABEL Laden OS LTS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
