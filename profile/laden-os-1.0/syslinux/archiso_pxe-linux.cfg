MENU LABEL Laden OS install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-laden
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-laden.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

