LABEL arch_nbd
TEXT HELP
Boot the Laden OS install medium using NBD.
It allows you to install Laden OS or perform system maintenance.
ENDTEXT
MENU LABEL Laden OS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-laden
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-laden.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
