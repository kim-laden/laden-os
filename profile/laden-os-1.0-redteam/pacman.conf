# Build-time pacman.conf for mkarchiso. Repos match the reference machine.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 6
DisableDownloadTimeout
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[laden]
SigLevel = Required DatabaseRequired
# Build machine: use the local signed repo (includes packages not yet uploaded).
# The live/installed system uses HTTPS via laden-mirrorlist.
Server = file:///srv/laden-repo/$arch
#Server = https://laden.no/repo/$arch

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
[multilib]
Include = /etc/pacman.d/mirrorlist

[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist
