LABEL laden
TEXT HELP
Start Laden OS 1.0.1 (live desktop and installer) on BIOS.
ENDTEXT
MENU LABEL Laden OS 1.0.1 Red Team live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-laden
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-laden.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL ladensafe
TEXT HELP
Start Laden OS with basic graphics (nomodeset), if the screen stays black.
ENDTEXT
MENU LABEL Laden OS 1.0.1 Red Team live, safe graphics (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-laden
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-laden.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
