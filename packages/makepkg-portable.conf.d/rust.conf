# Laden OS repo builds: portable to any x86-64-v3 CPU (same target as the cachyos-v3 repos).
# Remap the builder's home (cargo registry, build dirs) so no local paths end up in binaries.
RUSTFLAGS="-C opt-level=3 -C target-cpu=x86-64-v3 --remap-path-prefix=${HOME}=/build"
# Same for C/C++ objects built by cargo (cc/cxx crates) and cmake.
CFLAGS+=" -ffile-prefix-map=${HOME}=/build"
CXXFLAGS+=" -ffile-prefix-map=${HOME}=/build"
