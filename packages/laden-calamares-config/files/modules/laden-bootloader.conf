# Limine by default (same as the reference machine), systemd-boot as the
# UEFI fallback. Selected on the Bootloader page.
---
efiBootLoaderVar: "packagechooser_bootloader"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
    - "timeout 5"
    - "console-mode keep"
kernelParams: [ "quiet", "nowatchdog", "loglevel=3" ]
efiBootMgr: "efibootmgr"
efiBootloaderId: "laden-os"
installEFIFallback: true
installHybridGRUB: false
limineSplashLogo: "/usr/share/laden/limine-splash.png"
