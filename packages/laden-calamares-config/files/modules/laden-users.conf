---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - audio
    - video
    - storage
    - network
    - lp
    - rfkill
    - sys
autoLoginGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 4
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /usr/bin/fish
    forbidden_names: [ root, live, adm, bin, daemon, dbus, ftp, http, mail, nobody, alpm ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "laden-${product}"
    forbidden_names: [ localhost ]
