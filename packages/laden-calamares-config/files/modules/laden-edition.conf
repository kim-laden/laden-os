# Edition = Laden meta-package. Desktop is on the ISO and installs offline;
# the others are downloaded during the install (needs internet).
---
mode: required
method: packages
labels:
    step: "Edition"
default: desktop
items:
    - id: desktop
      name: "Laden OS Desktop"
      description: "KDE Plasma with Laden Update, Laden Kernel Manager and Laden Scheduler. Everything comes from this ISO, so no internet is needed."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop ]
    - id: gaming
      name: "Laden OS Gaming"
      description: "Desktop plus Steam, Proton-CachyOS, Wine, gamemode, MangoHud and gamescope. Downloaded during install: needs internet and several GB."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-gaming, proton-cachyos-slr, wine-cachyos-opt, winetricks ]
    - id: creator
      name: "Laden OS Creator"
      description: "Desktop plus Kdenlive, FFmpeg, ImageMagick, mpv and audio tools. Downloaded during install: needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-creator ]
    - id: streaming
      name: "Laden OS Streaming"
      description: "Desktop plus OBS Studio, PipeWire capture tools and Streamlink. Downloaded during install: needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-streaming ]
    - id: pentest
      name: "Laden OS Pentest"
      description: "Desktop plus nmap, Wireshark, Hashcat, John, Aircrack-ng, sqlmap and more. For systems you own or are allowed to test. Needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-pentest ]
    - id: full
      name: "Laden OS Full"
      description: "Every edition at once. Large download: needs internet and plenty of disk space."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-full ]
