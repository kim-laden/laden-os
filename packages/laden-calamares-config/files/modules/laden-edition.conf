# Edition = Laden meta-package. Standard (Desktop) is on the ISO and installs
# offline; the others are downloaded during the install (needs internet).
# Big apps (Steam and friends) can also be added later with laden-apps.
---
mode: required
method: packages
labels:
    step: "Edition"
default: desktop
items:
    - id: desktop
      name: "Laden OS Standard"
      description: "KDE Plasma with Laden Update, Kernel Manager, Scheduler, menu and art. NVIDIA, Intel and AMD graphics stacks are on this ISO. No internet needed for the base install; use Laden Apps afterwards for Steam and other big apps."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-apps ]
    - id: gaming
      name: "Laden OS Gaming"
      description: "Standard plus Steam, Proton-CachyOS, Wine, gamemode, MangoHud and gamescope. Downloaded during install: needs internet and several GB."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-gaming, laden-apps, proton-cachyos-slr, wine-cachyos-opt, winetricks ]
    - id: creator
      name: "Laden OS Creator"
      description: "Standard plus Kdenlive, FFmpeg, ImageMagick, mpv and audio tools. Downloaded during install: needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-creator, laden-apps ]
    - id: streaming
      name: "Laden OS Streaming"
      description: "Standard plus OBS Studio, PipeWire capture tools and Streamlink. Downloaded during install: needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-streaming, laden-apps ]
    - id: pentest
      name: "Laden OS Red Team"
      description: "Standard plus the pentest bundle, Tailscale and RustDesk tunnel helpers. For systems you own or are allowed to test. Needs internet."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-desktop, laden-pentest, laden-tunnels, laden-apps ]
    - id: full
      name: "Laden OS Full"
      description: "Network install of every edition at once from the repo. Large download: needs internet and plenty of disk space."
      screenshot: "/usr/share/calamares/branding/laden/welcome.png"
      packages: [ laden-full, laden-apps, laden-tunnels ]
