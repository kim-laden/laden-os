---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: true
showDonateUrl:       false
requirements:
    requiredStorage: 30
    requiredRam:     4.0
    internetCheckUrl: [ "https://cachyos.org", "https://geo.mirror.pkgbuild.com/" ]
    check:    [ storage, ram, power, internet, root, screen ]
    required: [ storage, ram, root ]
geoip:
    style:    "xml"
    url:      "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
