# chwd picks GPU drivers (NVIDIA, AMD, Intel). It downloads what it needs;
# without internet it is skipped and the open drivers from the ISO stay.
---
dontChroot: false
timeout: 3600
script:
    - command: "-/usr/lib/laden-installer/target-hardware"
      timeout: 3600
i18n:
    name: "Detecting your hardware and installing drivers"
