# SPDX-License-Identifier: GPL-3.0-or-later
# Laden OS installer sequence. Module configs are Laden instances
# (modules/laden-*.conf) so nothing owned by the calamares package is replaced.
---
modules-search: [ local ]

instances:
- { id: laden,      module: welcome,          config: laden-welcome.conf }
- { id: edition,    module: packagechooser,   config: laden-edition.conf }
- { id: bootloader, module: packagechooser,   config: laden-bootloader-choice.conf }
- { id: laden,      module: partition,        config: laden-partition.conf }
- { id: laden,      module: mount,            config: laden-mount.conf }
- { id: laden,      module: unpackfs,         config: laden-unpackfs.conf }
- { id: laden,      module: machineid,        config: laden-machineid.conf }
- { id: laden,      module: removeuser,       config: laden-removeuser.conf }
- { id: laden,      module: users,            config: laden-users.conf }
- { id: laden,      module: displaymanager,   config: laden-displaymanager.conf }
- { id: laden,      module: initcpiocfg,      config: laden-initcpiocfg.conf }
- { id: laden,      module: bootloader,       config: laden-bootloader.conf }
- { id: editions,   module: packages,         config: laden-packages.conf }
- { id: laden,      module: services-systemd, config: laden-services.conf }
- { id: laden,      module: finished,         config: laden-finished.conf }
- { id: hostprep,   module: shellprocess,     config: laden-hostprep.conf }
- { id: prepare,    module: shellprocess,     config: laden-prepare.conf }
- { id: hardware,   module: shellprocess,     config: laden-hardware.conf }
- { id: bootfix,    module: shellprocess,     config: laden-bootfix.conf }
- { id: firstboot,  module: shellprocess,     config: laden-firstboot.conf }

sequence:
- show:
  - welcome@laden
  - locale
  - keyboard
  - packagechooser@edition
  - packagechooser@bootloader
  - partition@laden
  - users@laden
  - summary
- exec:
  - partition@laden
  - mount@laden
  - unpackfs@laden
  - machineid@laden
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser@laden
  - shellprocess@hostprep
  - shellprocess@prepare
  - users@laden
  - networkcfg
  - displaymanager@laden
  - hwclock
  - shellprocess@hardware
  - packages@editions
  - initcpiocfg@laden
  - initcpio
  - bootloader@laden
  - shellprocess@bootfix
  - services-systemd@laden
  - shellprocess@firstboot
  - umount
- show:
  - finished@laden

branding: laden
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
