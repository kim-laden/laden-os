# BIOS variant of laden-partition.conf. laden-installer copies it over the
# normal one when the live system was not booted with UEFI.
# Limine can only read FAT (and ISO9660), so on BIOS machines /boot must be
# its own FAT32 partition: Limine's limine-bios.sys, limine.conf and the
# kernels live there. (On UEFI the ESP is /boot, so nothing extra is needed.)
#
# The CachyOS Calamares fork always creates an "EFI system partition" for
# Limine, also on BIOS (default 300 MiB at /boot/efi). The bootloader module
# writes limine.conf and limine-bios.sys into that partition, so it must be
# the FAT32 /boot that also holds the kernels. Use it as /boot here and do not
# add a second /boot to partitionLayout (two /boot entries break the install;
# an ESP at /boot/efi puts the Limine files away from the kernels and the
# installed disk cannot boot).
---
efiSystemPartition:     "/boot"
efiSystemPartitionSize: 2048M
efiSystemPartitionName: "LADEN_BOOT"
userSwapChoices: [ none, small, file ]
initialSwapChoice: none
luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

# Erase disk on BIOS: Calamares adds the 1 MiB bios_grub partition (GPT) and
# the 2 GiB FAT32 LADEN_BOOT /boot above; the layout only adds the root.
partitionLayout:
    - name: "LADEN_ROOT"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
