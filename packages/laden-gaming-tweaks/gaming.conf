# Laden OS gaming tweaks: local overrides (shell syntax). Values here beat the
# hardware profile in /usr/share/laden/gaming/hw/. Uncomment to change.
#SCX_SCHED=lavd          # sched-ext scheduler during game mode ("" = none)
#SCX_MODE=gaming
#PPD_PROFILE=performance # power profile during game mode
#GAME_PL1_W=60           # CPU long-term power limit while gaming (W)
#GAME_PL1_MIN_W=50
#GAME_PL1_MAX_W=75
#GAME_PL2_W=90
#PCORE_CAP_KHZ=5000000   # cap boost clocks while gaming ("" = no cap)
#KWIN_PRIMARY=auto       # auto|dgpu|igpu: GPU the desktop compositor renders on (next login)
#NOTIFY=1
