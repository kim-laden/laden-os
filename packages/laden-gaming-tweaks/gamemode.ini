; Laden OS GameMode config (package laden-gaming-tweaks).
; Per-user overrides go in ~/.config/gamemode.ini.
[general]
reaper_freq=5
; intel_pstate / amd_pstate: keep "powersave"; the performance power profile
; sets EPP=performance, which is what gives full boost.
desiredgov=powersave
defaultgov=powersave
softrealtime=off
renice=0
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[cpu]
park_cores=no
; scx_lavd places threads on P/E cores itself; pinning to P-cores only
; concentrates heat on the hottest cores of hybrid laptop CPUs.
pin_cores=no

; [gpu] is left out on purpose: nvidia-settings PowerMizer/clock offsets need an
; X display and do not work on Wayland; the NVIDIA driver boosts under load anyway.

[custom]
start=/usr/bin/laden-perf-on
end=/usr/bin/laden-perf-off
script_timeout=15
