# Acer Predator laptops (tuned on Predator Helios Neo 16S AI PHN16S-71, Core Ultra 9 275HX,
# RTX 5070 Ti Laptop). Firmware performance profile: CPU 85/140 W, GPU 100 W, faster fans.
# Measured 2026-11-09: all-core ~65 W (balanced fans) drives the favoured P-cores 0/2/4 into
# TCC throttling at 100 C; full 85 W in CS2 reached 105 C (2026-10-26). So: cap P-core boost
# (less voltage, no TCC clock cliffs) and keep PL1 adaptive below the thermal wall.
MATCH_VENDOR='^Acer$'
MATCH_PRODUCT='^Predator'
GAME_PL1_W=60
GAME_PL1_MIN_W=50
GAME_PL1_MAX_W=75
GAME_PL2_W=90
PCORE_CAP_KHZ=5000000
CPU_HOT_C=92
CPU_COOL_C=82
GPU_HOT_C=84
GPU_COOL_C=76
